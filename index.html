<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Endgame Catur</title>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1a1a2e;min-height:100vh;padding-bottom:70px}
header{background:#1a1a2e;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:18px;font-weight:600}
header p{font-size:12px;opacity:.7;margin-top:2px}
.search{padding:12px 16px;background:#fff;position:sticky;top:60px;z-index:9;border-bottom:1px solid #eee}
.search input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#f5f5f7}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:117px;z-index:8;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:6px 14px;background:#f0f0f3;border-radius:20px;font-size:13px;white-space:nowrap;border:none;cursor:pointer;color:#1a1a2e;font-weight:500}
.cat.active{background:#1a1a2e;color:#fff}
.list{padding:8px 0}
.item{padding:14px 20px;background:#fff;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item:active{background:#f0f0f3}
.item-name{font-weight:600;font-size:15px}
.item-cat{font-size:11px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.item-arrow{color:#bbb;font-size:18px}
.detail{padding:20px;background:#fff;min-height:calc(100vh - 180px)}
.detail h2{font-size:22px;margin-bottom:6px}
.detail .tag{display:inline-block;font-size:11px;background:#1a1a2e;color:#fff;padding:3px 10px;border-radius:12px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.detail p{font-size:15px;line-height:1.6;color:#333}
.detail .back{margin-bottom:16px;background:none;border:none;color:#1a1a2e;font-size:15px;cursor:pointer;font-weight:500}
.empty{padding:40px 20px;text-align:center;color:#888}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:20}
.nav button{flex:1;padding:10px 4px;background:none;border:none;cursor:pointer;font-size:11px;color:#888;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav button.active{color:#1a1a2e}
.nav button .ic{font-size:19px}
.quiz{padding:16px}
.quiz h2{font-size:18px;margin-bottom:6px}
.quiz .score{font-size:13px;color:#888;margin-bottom:16px}
.q-card{background:#fff;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q-card .q-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.q-card .q-text{font-size:16px;font-weight:600;line-height:1.4}
.opt{display:block;width:100%;padding:13px 16px;margin-bottom:9px;background:#fff;border:2px solid #eee;border-radius:12px;font-size:15px;text-align:left;cursor:pointer;color:#1a1a2e;font-weight:500}
.opt.correct{background:#d4f4dd;border-color:#2ecc71}
.opt.wrong{background:#fdd;border-color:#e74c3c}
.opt:disabled{cursor:default}
.next-btn{width:100%;padding:14px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.next-btn:disabled{opacity:.5}
.progress{padding:16px}
.stat-card{background:#fff;padding:20px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card h3{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .big{font-size:30px;font-weight:700}
.stat-card .sub{font-size:13px;color:#888;margin-top:2px}
.reset-btn{width:100%;padding:12px;background:#fff;color:#e74c3c;border:2px solid #e74c3c;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px}
/* Board & Pos */
.pos-list{padding:12px}
.pos-item{background:#fff;padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
.pos-item .pn{font-weight:600;font-size:15px}
.pos-item .pg{font-size:12px;color:#888;margin-top:3px}
.pos-item .ar{color:#bbb;font-size:20px}
.board-wrap{padding:16px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;max-width:420px;margin:0 auto;border:2px solid #333;border-radius:6px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative}
.sq.light{background:#f0d9b5}
.sq.dark{background:#b58863}
.sq.sel{box-shadow:inset 0 0 0 4px #f7d038;background:rgba(247,208,56,.4)}
.sq.hint-move::after{content:'';position:absolute;width:26%;height:26%;background:rgba(0,0,0,.35);border-radius:50%}
.sq.hint-cap{box-shadow:inset 0 0 0 4px rgba(231,76,60,.6)}
.sq.check{background:#e74c3c!important}
.sq img{width:90%;height:90%;object-fit:contain;pointer-events:none}
.pos-info{padding:0 16px 16px}
.pos-info h2{font-size:17px;margin-bottom:4px}
.pos-info .goal{font-size:13px;color:#555;line-height:1.5;margin-bottom:8px}
.status{font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:10px;text-align:center}
.status.win{background:#d4f4dd;color:#1a7a3e}
.status.lose{background:#fdd;color:#a02020}
.status.draw{background:#e8e8ec;color:#444}
.status.info{background:#e3efff;color:#1a4a7a}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row button{flex:1;padding:11px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-secondary{background:#f0f0f3;color:#1a1a2e}
.tut-box{display:none;background:#fffbe6;border-left:4px solid #f7d038;padding:12px 16px;border-radius:8px;margin:10px 0;font-size:13px;line-height:1.6;color:#333}
</style>
</head>
<body>

<header>
  <h1>♟ Endgame Catur</h1>
  <p>Materi · Kuis · Latihan Interaktif</p>
</header>

<main id="app"></main>

<nav class="nav">
  <button data-tab="belajar" class="active"><span class="ic">📚</span>Materi</button>
  <button data-tab="latihan"><span class="ic">🎯</span>Kuis</button>
  <button data-tab="posisi"><span class="ic">♟</span>Latihan</button>
  <button data-tab="progress"><span class="ic">📊</span>Progress</button>
</nav>

<script>
// ============ DATABASE MATERI ============
const DB = [
["King activity","umum","Raja harus aktif di endgame: maju ke pusat, dukung pion, serang pion lawan. Jangan sembunyikan raja di pojok saat endgame."],
["Two weaknesses","umum","Prinsip menyerang dua kelemahan sekaligus; lawan tak bisa bertahan di dua tempat. Ciptakan satu kelemahan di sayap kiri, lalu serang sayap kanan."],
["Passed pawn","umum","Pion bebas: tidak ada pion lawan di file sama atau file sebelah di depannya. Pion ini sangat berharga karena bisa promosi."],
["Outside passed pawn","umum","Pion bebas di sayap jauh, dipakai menarik raja lawan dari pusat. Saat raja lawan tertarik, raja kita bebas menyerang sisi lain."],
["Zugzwang","umum","Terpaksa jalan ke posisi lebih buruk; tidak ada langkah netral. Sering terjadi di endgame pion."],
["Triangulation","umum","Raja berputar 3 langkah (misal Kd4-Ke4-Kd5) untuk kehilangan tempo dan memaksa lawan jalan (Zugzwang)."],
["Direct opposition","pion","Raja berhadapan satu kotak kosong. Pemain yang *tidak* mendapat giliran jalan (memegang opposition) memiliki kontrol lebih besar dan bisa memaksa raja lawan minggir."],
["Distant opposition","pion","Opposition berjarak ganjil (3, 5, 7 kotak). Teknik yang sama dengan direct opposition, tapi dari jarak jauh."],
["Key squares","pion","Kotak ajaib di depan pion. Jika raja Anda berhasil mencapai kotak ini, pion dijamin promosi, tidak peduli di mana raja lawan berada."],
["Square of the pawn","pion","Aturan hitung cepat: bayangkan kotak dari pion ke kotak promosi. Jika raja lawan berada di dalam kotak tersebut, ia bisa mengejar pion. Jika di luar, pion akan promosi."],
["Rook behind the passed pawn","benteng","Benteng paling kuat ditempatkan di belakang pion bebas (baik pion sendiri maupun lawan). Jangan letakkan benteng di depan pion sendiri."],
["Lucena position","benteng","Posisi menang klasik paling penting di endgame benteng. Terjadi saat Anda memiliki Benteng dan Pion di baris ke-7, sementara raja lawan terkurung. Kunci kemenangannya adalah 'Building a Bridge'."],
["Building a bridge","benteng","Teknik di Lucena: letakkan benteng Anda di baris ke-4/5 untuk melindungi raja dari skak lawan. Benteng menjadi 'jembatan' agar raja bisa keluar."],
["Philidor position","benteng","Posisi bertahan klasik di endgame benteng. Saat lawan punya pion di baris ke-6, letakkan benteng Anda di baris ke-3 untuk mencegah raja lawan maju."],
["Vancura position","benteng","Pertahanan benteng vs pion sayap (rook pawn). Benteng lawan diserang dari samping secara terus-menerus untuk meraih seri."],
["Wrong bishop","uskup","Uskup yang warnanya tidak cocok dengan kotak promosi pion (biasanya pion rook/benteng). Posisi ini sering berakhir seri (draw) meski punya kelebihan uskup."],
["Opposite-colored bishops","uskup","Uskup beda warna. Sering berakhir seri/fortress meski salah satu pihak unggul 1-2 pion, karena uskup tidak bisa menyerang kotak yang sama."],
["Bishop vs knight","uskup","Uskup unggul di posisi terbuka dengan pion di dua sayap. Kuda unggul di posisi tertutup dengan struktur pion terkunci."],
["Knight blockade","kuda","Kuda adalah buah terbaik untuk memblokade pion bebas lawan, karena kuda bisa mundur dan tetap menyerang kotak di sekitarnya."],
["Queen vs pawn on 7th","ratu","Raja sendiri harus mendekat, ratu mengunci raja lawan. Hindari pat (stalemate) yang sering terjadi di sini."],
["Queen perpetual check","ratu","Skak berulang dengan ratu; senjata bertahan saat materi kurang. Cari posisi di mana ratu bisa terus memberi skak tanpa tertangkap."],
["King + queen vs king","material","Skakmat dasar. Ajari raja mendekat dulu (bukan ratu yang mengejar), lalu beri skakmat di tepi."],
["King + rook vs king","material","Skakmat dasar. Teknik raja + benteng: potong raja lawan, dekatkan raja, beri skakmat di tepi."],
["King + two bishops vs king","material","Skakmat dasar. Dua uskup bekerja sama menyapu raja lawan ke sudut."],
["King + bishop + knight vs king","material","Skakmat sulit yang butuh teknik khusus. Harus mengurung raja lawan di sudut yang warnanya sama dengan uskup."],
["King + two knights vs king","material","Tidak bisa skakmat paksa; hanya seri. Kecuali lawan membuat kesalahan (blunder)."],
["Active defense","bertahan","Aktifkan raja & buah. Bertahan pasif (hanya menunggu) hampir selalu kalah perlahan-lahan."],
["Counterplay","bertahan","Ciptakan ancaman balik (misal serang pion lawan) untuk mengalihkan perhatian lawan dari rencana menyerangnya."],
["50-move rule","aturan","Seri jika 50 langkah (100 ply) tanpa ada pion yang bergerak dan tanpa ada buah yang dimakan."],
["Threefold repetition","aturan","Seri jika posisi yang sama (buah yang sama di kotak yang sama, langkah yang sama) terjadi 3 kali."]
];

const CATS = {umum:"Umum",pion:"Raja & Pion",benteng:"Benteng",uskup:"Uskup",kuda:"Kuda",ratu:"Ratu",material:"Material",bertahan:"Bertahan",aturan:"Aturan"};
const TERMS = DB.map(([name,cat,desc],i)=>({id:i,name,cat,desc}));

// ============ POSISI LATIHAN & TUTORIAL ============
const POSITIONS = [
  {
    id:'szn', name:'Szen Breakthrough', fen:'7k/1ppp4/8/1PPP4/8/8/8/K7 w - - 0 1', playerColor:'w',
    goal:'Ciptakan pion bebas dan promosikan.',
    tutorial:"<b>Tujuan:</b> Membobol barisan pion lawan untuk menciptakan pion bebas.<br><br><b>Langkah:</b><br>1. Mainkan <b>b6!</b> (Pion b mengorbankan diri).<br>2. Hitam terpaksa menjawab <b>cxb6</b>.<br>3. Mainkan <b>c6!</b> (Pion c maju membuka jalan).<br>4. Hitam menjawab <b>bxc6</b>.<br>5. Mainkan <b>d6!</b> (Pion d sekarang bebas dan tidak bisa dihentikan!).",
    solution: ['b6', 'cxb6', 'c6', 'bxc6', 'd6']
  },
  {
    id:'kqk', name:'Skakmat K+Q vs K', fen:'8/8/8/4k3/8/8/4K3/6Q1 w - - 0 1', playerColor:'w',
    goal:'Skakmat raja hitam.',
    tutorial:"<b>Teknik:</b><br>1. Gunakan ratu untuk memotong raja lawan. Jaga ratu berjarak satu langkah kuda dari raja hitam.<br>2. Dekatkan raja putih Anda.<br>3. Saat raja hitam sudah di tepi papan, beri skakmat dengan ratu.",
    solution: null
  },
  {
    id:'krk', name:'Skakmat K+R vs K', fen:'8/8/8/4k3/8/8/4K3/6R1 w - - 0 1', playerColor:'w',
    goal:'Skakmat raja hitam dengan raja + benteng.',
    tutorial:"<b>Teknik:</b><br>1. Gunakan Benteng untuk memotong papan (misal Rg5).<br>2. Dekatkan raja putih sejajar dengan raja hitam.<br>3. Saat raja lawan mentok di tepi, beri skakmat dengan benteng.",
    solution: null
  },
  {
    id:'opp', name:'Opposition Dasar', fen:'8/8/4k3/8/4K3/8/8/8 w - - 0 1', playerColor:'w',
    goal:'Demonstrasi opposition. Anda (putih) memegang opposition.',
    tutorial:"<b>Konsep:</b><br>Hitam harus jalan. Jika hitam maju, Anda ikuti dan rebut kotak kuncinya.<br>1. Jika hitam ke d6, mainkan Kd4.<br>2. Jika hitam ke f6, mainkan Kf4.<br>Tujuannya adalah memaksa raja hitam mundur dari pusat.",
    solution: null
  },
  {
    id:'lucena', name:'Lucena Position', fen:'1K6/1P6/8/8/8/7k/1r6/7R w - - 0 1', playerColor:'w',
    goal:'Menangkan dengan building a bridge.',
    tutorial:"<b>Teknik (Building a Bridge):</b><br>1. Mainkan <b>Rh4!</b> (Benteng siap jadi jembatan).<br>2. Jika hitam mengejar raja (Rc2), mainkan Kb7.<br>3. Jika hitam menjauh (Rd2), mainkan <b>Rh5!</b> (jembatan dibangun).<br>4. Raja putih bisa keluar (Kc6/c7) dengan aman dari skak.",
    solution: ['Rh4', 'Rc2', 'Kb7', 'Rd2', 'Rh5']
  },
  {
    id:'philidor', name:'Philidor Defense', fen:'4k3/8/3K4/4P3/4r3/8/8/4R3 b - - 0 1', playerColor:'b',
    goal:'Bertahan (draw) sebagai hitam.',
    tutorial:"<b>Teknik Bertahan:</b><br>1. Hitam harus bermain <b>Rf4!</b> (memotong raja putih dari samping).<br>2. Jika putih mendekat (Ke6), hitam beri skak dari belakang (Rf6+).<br>3. Selama benteng hitam berada di baris ke-3, putih tidak akan pernah bisa menang.",
    solution: ['Rf4', 'Ke6', 'Rf6+']
  },
  {
    id:'qp7', name:'Queen vs Pawn on 7th', fen:'8/8/8/8/8/6K1/1p6/3Q4 w - - 0 1', playerColor:'w',
    goal:'Hentikan pion hitam dan menangkan.',
    tutorial:"<b>Teknik:</b><br>1. Mainkan <b>Qb3!</b> untuk menghentikan laju pion.<br>2. Jika raja hitam mendekat, gunakan ratu untuk memberi skak atau mengunci raja.<br>3. Dekatkan raja putih Anda perlahan-lahan. Hati-hati pat (stalemate).",
    solution: ['Qb3', 'Kf2', 'Qa3']
  }
];

// ============ STATE ============
let state = {
  tab:'belajar', filter:'all', query:'', detail:null,
  quiz:{q:null,opts:[],answered:false,score:0,total:0,streak:0,best:0,correctIdx:0,chosenIdx:-1},
  pos:{current:null,chess:null,playerColor:'w',sel:null,hints:[],aiThinking:false,status:null,statusType:'info',stepIndex:0}
};

function loadProgress(){
  try{
    const p = JSON.parse(localStorage.getItem('eg_progress')||'{}');
    Object.assign(state.quiz,p.quiz||{});
    state.pos.solved = p.solved||{};
  }catch(e){state.pos.solved={};}
}
function saveProgress(){ localStorage.setItem('eg_progress',JSON.stringify({quiz:state.quiz,solved:state.pos.solved})); }
loadProgress();

const app = document.getElementById('app');

// ============ ROUTER ============
function render(){
  if(state.detail!==null){return renderDetail();}
  if(state.pos.current!==null){return renderPosisiPlay();}
  switch(state.tab){
    case 'belajar': return renderBelajar();
    case 'latihan': return renderLatihan();
    case 'posisi': return renderPosisiList();
    case 'progress': return renderProgress();
  }
}

// ============ TAB MATERI ============
function renderBelajar(){
  let filtered = TERMS;
  if(state.filter!=='all') filtered = filtered.filter(t=>t.cat===state.filter);
  if(state.query){
    const q = state.query.toLowerCase();
    filtered = filtered.filter(t=>t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));
  }
  const catList = Object.entries(CATS).map(([k,v])=>`<button class="cat ${state.filter===k?'active':''}" data-cat="${k}">${v}</button>`).join('');
  const items = filtered.length ? filtered.map(t=>`<div class="item" data-id="${t.id}"><div><div class="item-name">${t.name}</div><div class="item-cat">${CATS[t.cat]}</div></div><span class="item-arrow">›</span></div>`).join('') : '<div class="empty">Tidak ada istilah ditemukan</div>';
  app.innerHTML = `<div class="search"><input type="search" placeholder="Cari materi..." value="${state.query}" id="q"></div><div class="cats"><button class="cat ${state.filter==='all'?'active':''}" data-cat="all">Semua</button>${catList}</div><div class="list">${items}</div>`;
  
  document.getElementById('q').addEventListener('input',e=>{state.query=e.target.value; renderBelajar(); document.getElementById('q').focus();});
  document.querySelectorAll('.cat').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.cat;renderBelajar();}));
  document.querySelectorAll('.list .item').forEach(el=>el.addEventListener('click',()=>{state.detail=parseInt(el.dataset.id);render();}));
}

function renderDetail(){
  const t = TERMS[state.detail];
  if(!t){state.detail=null;return render();}
  app.innerHTML = `<div class="detail"><button class="back" onclick="goBack()">‹ Kembali</button><span class="tag">${CATS[t.cat]}</span><h2>${t.name}</h2><p>${t.desc}</p></div>`;
}
window.goBack = ()=>{state.detail=null;render();};

// ============ TAB KUIS ============
function renderLatihan(){
  const q = state.quiz;
  if(!q.q) startQuestion();
  const optsHtml = q.opts.map((o,i)=>{
    let cls='opt';
    if(q.answered){ if(i===q.correctIdx) cls+=' correct'; else if(i===q.chosenIdx) cls+=' wrong'; }
    return `<button class="${cls}" data-opt="${i}" ${q.answered?'disabled':''}>${o.name}</button>`;
  }).join('');
  app.innerHTML = `<div class="quiz"><h2>Kuis Materi</h2><div class="score">Skor: ${q.score}/${q.total} · Streak: ${q.streak}</div><div class="q-card"><div class="q-label">Istilah ini adalah?</div><div class="q-text">${q.q.desc}</div></div>${optsHtml}<button class="next-btn" id="next" ${q.answered?'':'disabled'}>${q.answered?'Soal Berikutnya →':'Pilih jawaban dulu'}</button></div>`;
  
  document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    if(q.answered)return;
    const i=parseInt(el.dataset.opt); q.chosenIdx=i; q.answered=true;
    if(i===q.correctIdx){q.score++;q.total++;q.streak++;if(q.streak>q.best)q.best=q.streak;}
    else{q.total++;q.streak=0;}
    saveProgress(); renderLatihan();
  }));
  document.getElementById('next').addEventListener('click',()=>{q.q=null;q.answered=false;startQuestion();renderLatihan();});
}

function startQuestion(){
  const q = state.quiz;
  const t = TERMS[Math.floor(Math.random()*TERMS.length)];
  const sameCat = TERMS.filter(x=>x.cat===t.cat && x.id!==t.id);
  const pool = sameCat.length>=3?sameCat:TERMS.filter(x=>x.id!==t.id);
  const shuffled = pool.slice().sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [t,...shuffled].sort(()=>Math.random()-0.5);
  q.q=t; q.opts=opts; q.correctIdx=opts.findIndex(x=>x.id===t.id); q.chosenIdx=-1; q.answered=false;
}

// ============ TAB LATIHAN PAPAN ============
const PIECE_URLS = {
    'w': {'p': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg','n': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg','b': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg','r': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg','q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg','k': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'},
    'b': {'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg','n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg','b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg','r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg','q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg','k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'}
};

function renderPosisiList(){
  const items = POSITIONS.map(p=>{
    const done = state.pos.solved&&state.pos.solved[p.id];
    return `<div class="pos-item" data-id="${p.id}"><div><div class="pn">${p.name} ${done?'✅':''}</div><div class="pg">${p.playerColor==='w'?'Main Putih':'Main Hitam'}</div></div><span class="ar">›</span></div>`;
  }).join('');
  app.innerHTML = `<div class="pos-list"><h2 style="padding:8px 4px 12px;font-size:18px">Latihan Interaktif</h2>${items}</div>`;
  document.querySelectorAll('.pos-item').forEach(el=>el.addEventListener('click',()=>{ startPosition(el.dataset.id); }));
}

function startPosition(id){
  const p = POSITIONS.find(x=>x.id===id);
  if(!p)return;
  state.pos.current = p;
  state.pos.chess = new Chess(p.fen);
  state.pos.playerColor = p.playerColor;
  state.pos.sel = null;
  state.pos.hints = [];
  state.pos.status = null;
  state.pos.statusType = 'info';
  state.pos.aiThinking = false;
  state.pos.stepIndex = 0;
  render();
}

function renderPosisiPlay(){
  const pos = state.pos;
  const chess = pos.chess;
  const flip = pos.playerColor==='b';
  const board = chess.board();
  let boardHtml='';
  
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const rr = flip?7-r:r, ff = flip?7-f:f;
      const sq = board[rr][ff];
      const sqName = 'abcdefgh'[ff]+(8-rr);
      const isLight = (rr+ff)%2===0;
      let cls = 'sq '+(isLight?'light':'dark');
      if(pos.sel===sqName) cls+=' sel';
      if(pos.hints.includes(sqName)) cls+= sq?' hint-cap':' hint-move';
      if(sq && sq.type==='k' && chess.in_check() && sq.color===chess.turn()) cls+=' check';
      let pieceHtml='';
      if(sq) pieceHtml = `<img src="${PIECE_URLS[sq.color][sq.type]}" alt="piece">`;
      boardHtml += `<div class="${cls}" data-sq="${sqName}">${pieceHtml}</div>`;
    }
  }

  let statusHtml = '';
  if(pos.status){
    const cls = pos.statusType==='win'?'win':pos.statusType==='lose'?'lose':pos.statusType==='draw'?'draw':'info';
    statusHtml = `<div class="status ${cls}">${pos.status}</div>`;
  }

  app.innerHTML = `
    <div class="board-wrap">
      <button class="back" onclick="closePos()" style="margin-bottom:10px;background:none;border:none;color:#1a1a2e;font-size:15px;cursor:pointer;font-weight:500">‹ Kembali</button>
      <div class="board">${boardHtml}</div>
      <div class="pos-info" style="margin-top:14px">
        <h2>${pos.current.name}</h2>
        <div class="goal">🎯 ${pos.current.goal}</div>
        
        <button class="btn-secondary" style="width:100%; margin-bottom:10px; padding:10px; border-radius:8px; border:none; font-weight:600; cursor:pointer" onclick="toggleTut()">📖 Buka Panduan / Tutorial</button>
        <div class="tut-box" id="tutBox">${pos.current.tutorial}</div>
        
        ${statusHtml}
        <div class="btn-row">
          <button class="btn-primary" onclick="resetPos()">Ulangi</button>
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.sq').forEach(el=>el.addEventListener('click',()=>onSquareClick(el.dataset.sq)));
}

window.toggleTut = ()=>{ const el = document.getElementById('tutBox'); el.style.display = el.style.display === 'none' || el.style.display === '' ? 'block' : 'none'; };
window.closePos = ()=>{state.pos.current=null;state.pos.chess=null;render();};
window.resetPos = ()=>{ if(state.pos.current) startPosition(state.pos.current.id); };

function onSquareClick(sqName){
  const pos = state.pos;
  const chess = pos.chess;
  if(pos.aiThinking || chess.game_over() || chess.turn()!==pos.playerColor) return;
  
  const piece = chess.get(sqName);
  if(piece && piece.color===pos.playerColor){
    pos.sel = sqName;
    pos.hints = chess.moves({square:sqName,verbose:true}).map(m=>m.to);
    renderPosisiPlay(); return;
  }
  
  if(pos.sel && pos.hints.includes(sqName)){
    let promo;
    if((pos.sel[1]==='7' && sqName[1]==='8') || (pos.sel[1]==='2' && sqName[1]==='1')) promo='q';
    try{
      const move = chess.move({from:pos.sel,to:sqName,promotion:promo});
      pos.sel=null; pos.hints=[];
      
      // VALIDASI LANGKAH TUTORIAL
      if (pos.current.solution && pos.stepIndex < pos.current.solution.length) {
          const expected = pos.current.solution[pos.stepIndex];
          if (move.san !== expected) {
              chess.undo(); // Batalkan langkah
              pos.status = "❌ Belum tepat. Baca tutorialnya dan coba lagi."; pos.statusType = 'lose';
              renderPosisiPlay(); return;
          } else {
              pos.stepIndex++;
              pos.status = "✅ Langkah benar! Lanjutkan."; pos.statusType = 'win';
          }
      }
      afterMove();
    }catch(e){return;}
  }
  
  pos.sel=null; pos.hints=[]; renderPosisiPlay();
}

function afterMove(){
  const pos = state.pos;
  const chess = pos.chess;
  if(chess.game_over()){ handleGameOver(); renderPosisiPlay(); return; }
  
  if(chess.turn()!==pos.playerColor){
    pos.aiThinking = true; pos.status = 'AI berpikir...'; pos.statusType='info'; renderPosisiPlay();
    setTimeout(()=>{
      let aiMove = null;
      // AI mengikuti solusi tutorial jika ada
      if (pos.current.solution && pos.stepIndex < pos.current.solution.length) {
          const expected = pos.current.solution[pos.stepIndex];
          const moves = chess.moves({verbose:true});
          const match = moves.find(m => m.san === expected);
          if (match) { aiMove = match; pos.stepIndex++; }
      }
      if (!aiMove) aiMove = getAIMove(chess,3); // Fallback ke minimax

      if(aiMove){ try{chess.move(aiMove);}catch(e){} }
      pos.aiThinking=false;
      if(chess.game_over()){ handleGameOver(); } else { pos.status=null; }
      renderPosisiPlay();
    },100);
  } else { renderPosisiPlay(); }
}

function handleGameOver(){
  const pos = state.pos;
  const chess = pos.chess;
  const playerLost = chess.turn()===pos.playerColor;
  if(chess.in_checkmate()){
    if(playerLost){ pos.status = '❌ Skakmat — kamu kalah. Coba lagi!'; pos.statusType='lose'; }
    else { pos.status = '🎉 Skakmat — kamu menang!'; pos.statusType='win'; markSolved(pos.current.id); }
  } else if(chess.in_stalemate()||chess.in_draw()){
    pos.status = '🤝 Seri (stalemate/draw).';
    pos.statusType='draw';
    if(pos.current.id==='philidor' || pos.current.id==='opp'){
      pos.status = '✅ Berhasil bertahan (seri)!'; pos.statusType='win'; markSolved(pos.current.id);
    }
  }
}

function markSolved(id){ if(!state.pos.solved) state.pos.solved={}; state.pos.solved[id]=true; saveProgress(); }

// AI Sederhana
function evalFull(chess){
  if(chess.in_checkmate()) return chess.turn()==='w'?-9999:9999;
  if(chess.in_draw()||chess.in_stalemate()) return 0;
  const val = {p:100,n:320,b:330,r:500,q:900,k:0};
  let s=0;
  chess.board().forEach(row=>row.forEach(sq=>{ if(sq) s += sq.color==='w' ? val[sq.type] : -val[sq.type]; }));
  s += (chess.turn()==='w'?1:-1)*chess.moves().length*2; return s;
}
function search(chess, depth, alpha, beta){
  if(depth===0 || chess.game_over()) return evalFull(chess);
  const moves = chess.moves({verbose:true});
  if(chess.turn()==='w'){
    let best=-Infinity;
    for(const m of moves){ chess.move(m); const s = search(chess,depth-1,alpha,beta); chess.undo(); if(s>best)best=s; if(best>alpha)alpha=best; if(alpha>=beta)break; }
    return best;
  } else {
    let best=Infinity;
    for(const m of moves){ chess.move(m); const s = search(chess,depth-1,alpha,beta); chess.undo(); if(s<best)best=s; if(best<beta)beta=best; if(alpha>=beta)break; }
    return best;
  }
}
function getAIMove(chess, depth){
  const moves = chess.moves({verbose:true}); if(!moves.length) return null;
  const isWhite = chess.turn()==='w'; let bestScore = isWhite ? -Infinity : Infinity; let bestMoves = [];
  for(const m of moves){ chess.move(m); const s = search(chess,depth-1,-Infinity,Infinity); chess.undo();
    if(isWhite ? s>bestScore : s<bestScore){ bestScore = s; bestMoves = [m]; } else if(s===bestScore){ bestMoves.push(m); }
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

// ============ TAB PROGRESS ============
function renderProgress(){
  const q = state.quiz;
  const acc = q.total>0?Math.round((q.score/q.total)*100):0;
  const solved = Object.keys(state.pos.solved||{}).length;
  const total = POSITIONS.length;
  app.innerHTML = `<div class="progress"><div class="stat-card"><h3>Kuis</h3><div class="big">${q.score}/${q.total}</div><div class="sub">Akurasi ${acc}%</div></div><div class="stat-card"><h3>Streak Terbaik</h3><div class="big">${q.best}</div><div class="sub">jawaban benar berturut-turut</div></div><div class="stat-card"><h3>Posisi Diselesaikan</h3><div class="big">${solved}/${total}</div><div class="sub">latihan papan</div></div><button class="reset-btn" onclick="resetAll()">Reset Semua Progress</button></div>`;
}
window.resetAll = ()=>{ if(!confirm('Reset semua progress?')) return; state.quiz = {q:null,opts:[],answered:false,score:0,total:0,streak:0,best:0,correctIdx:0,chosenIdx:-1}; state.pos.solved = {}; saveProgress(); render(); };

// ============ NAV ============
document.querySelectorAll('.nav button').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    state.tab = el.dataset.tab; state.detail = null; state.pos.current = null; render();
  });
});

render();
</script>
