*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1a1a2e;min-height:100vh;padding-bottom:70px}
header{background:#1a1a2e;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:18px;font-weight:600}
header p{font-size:12px;opacity:.7;margin-top:2px}
.search{padding:12px 16px;background:#fff;position:sticky;top:60px;z-index:9;border-bottom:1px solid #eee}
.search input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#f5f5f7}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:117px;z-index:8;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:6px 14px;background:#f0f0f3;border-radius:20px;font-size:13px;white-space:nowrap;border:none;cursor:pointer;color:#1a1a2e;font-weight:500}
.cat.active{background:#1a1a2e;color:#fff}
.list{padding:8px 0}
.item{padding:14px 20px;background:#fff;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item:active{background:#f0f0f3}
.item-name{font-weight:600;font-size:15px}
.item-cat{font-size:11px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.item-arrow{color:#bbb;font-size:18px}
.detail{padding:20px;background:#fff;min-height:calc(100vh - 180px)}
.detail h2{font-size:22px;margin-bottom:6px}
.detail .tag{display:inline-block;font-size:11px;background:#1a1a2e;color:#fff;padding:3px 10px;border-radius:12px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.detail p{font-size:15px;line-height:1.6;color:#333}
.detail .back{margin-bottom:16px;background:none;border:none;color:#1a1a2e;font-size:15px;cursor:pointer;font-weight:500}
.empty{padding:40px 20px;text-align:center;color:#888}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:20}
.nav button{flex:1;padding:10px 4px;background:none;border:none;cursor:pointer;font-size:11px;color:#888;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.nav button.active{color:#1a1a2e}
.nav button .ic{font-size:19px}
.quiz{padding:16px}
.quiz h2{font-size:18px;margin-bottom:6px}
.quiz .score{font-size:13px;color:#888;margin-bottom:16px}
.q-card{background:#fff;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q-card .q-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.q-card .q-text{font-size:16px;font-weight:600;line-height:1.4}
.opt{display:block;width:100%;padding:13px 16px;margin-bottom:9px;background:#fff;border:2px solid #eee;border-radius:12px;font-size:15px;text-align:left;cursor:pointer;color:#1a1a2e;font-weight:500}
.opt.correct{background:#d4f4dd;border-color:#2ecc71}
.opt.wrong{background:#fdd;border-color:#e74c3c}
.opt:disabled{cursor:default}
.next-btn{width:100%;padding:14px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.next-btn:disabled{opacity:.5}
.progress{padding:16px}
.stat-card{background:#fff;padding:20px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card h3{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .big{font-size:30px;font-weight:700}
.stat-card .sub{font-size:13px;color:#888;margin-top:2px}
.reset-btn{width:100%;padding:12px;background:#fff;color:#e74c3c;border:2px solid #e74c3c;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px}
/* Board */
.pos-list{padding:12px}
.pos-item{background:#fff;padding:14px 16px;border-radius:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center}
.pos-item .pn{font-weight:600;font-size:15px}
.pos-item .pg{font-size:12px;color:#888;margin-top:3px}
.pos-item .ar{color:#bbb;font-size:20px}
.board-wrap{padding:16px}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;max-width:420px;margin:0 auto;border:2px solid #333;border-radius:6px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,38px);cursor:pointer;user-select:none;position:relative;line-height:1}
.sq.light{background:#f0d9b5}
.sq.dark{background:#b58863}
.sq.sel{box-shadow:inset 0 0 0 4px #f7d038}
.sq.hint-move::after{content:'';position:absolute;width:26%;height:26%;background:rgba(0,0,0,.35);border-radius:50%}
.sq.hint-cap{box-shadow:inset 0 0 0 4px rgba(231,76,60,.6)}
.sq.check{background:#e74c3c!important}
.piece-w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000}
.piece-b{color:#111;text-shadow:0 0 2px #fff,0 0 2px #fff,1px 1px 0 #fff,-1px -1px 0 #fff}
.pos-info{padding:0 16px 16px}
.pos-info h2{font-size:17px;margin-bottom:4px}
.pos-info .goal{font-size:13px;color:#555;line-height:1.5;margin-bottom:8px}
.pos-info .hint{font-size:12px;background:#fffbe6;border-left:3px solid #f7d038;padding:8px 12px;border-radius:6px;color:#555;margin-bottom:10px}
.pos-info .status{font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;margin-bottom:10px;text-align:center}
.status.win{background:#d4f4dd;color:#1a7a3e}
.status.lose{background:#fdd;color:#a02020}
.status.draw{background:#e8e8ec;color:#444}
.status.info{background:#e3efff;color:#1a4a7a}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row button{flex:1;padding:11px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-secondary{background:#f0f0f3;color:#1a1a2e}
</style>
</head>

const CATS = {umum:"Umum",pion:"Raja & Pion",benteng:"Benteng",uskup:"Uskup",kuda:"Kuda",ratu:"Ratu",material:"Material",bertahan:"Bertahan",hitung:"Hitung",posisi:"Nama Posisi",struktur:"Struktur Pion",study:"Studi",jenis:"Jenis Endgame",aturan:"Aturan"};

const TERMS = DB.map(([name,cat,desc],i)=>({id:i,name,cat,desc}));

/* ============ POSISI LATIHAN ============ */
const POSITIONS = [
  {id:'kqk',name:'Skakmat K+Q vs K',fen:'8/8/8/4k3/8/8/4K3/6Q1 w - - 0 1',playerColor:'w',goal:'Skakmat raja hitam. Gunakan ratu untuk mengurung, raja mendekat.',hint:'Jaga ratu berjarak gerak kuda dari raja lawan. Raja putih maju mendekat.'},
  {id:'krk',name:'Skakmat K+R vs K',fen:'8/8/8/4k3/8/8/4K3/6R1 w - - 0 1',playerColor:'w',goal:'Skakmat raja hitam dengan raja + benteng. Kunci raja lawan di tepi.',hint:'Benteng potong baris, raja mendekat, beri skakmat di tepi.'},
  {id:'szn',name:'Breakthrough (Szen)',fen:'7k/1ppp4/8/1PPP4/8/8/8/K7 w - - 0 1',playerColor:'w',goal:'Ciptakan pion bebas dan promosikan. Terobosan pion adalah kunci.',hint:'1.b6! cxb6 2.c6! bxc6 3.d6 dan pion d bebas.'},
  {id:'qp7',name:'Queen vs Pawn on 7th',fen:'8/8/8/8/8/6K1/1p6/3Q4 w - - 0 1',playerColor:'w',goal:'Hentikan pion hitam dan menangkan. Ratu + raja harus bekerja sama.',hint:'1.Qb3! (atau Qd2) menghentikan promosi. Raja mendekat.'},
  {id:'lucena',name:'Lucena Position',fen:'1K6/1P6/8/8/8/7k/1r6/7R w - - 0 1',playerColor:'w',goal:'Menangkan dengan building a bridge. Pion b7 sudah di baris 7.',hint:'1.Rh4! (siap jembatan) lalu raja keluar, benteng beri check, raja dukung promosi.'},
  {id:'philidor',name:'Philidor Defense',fen:'4k3/8/3K4/4P3/4r3/8/8/4R3 b - - 0 1',playerColor:'b',goal:'Bertahan (draw). Hitam harus mempertahankan Philidor.',hint:'1...Rf4! memotong raja. Jika putih mendekat, beri check dari belakang.'},
  {id:'opp',name:'Opposition Dasar',fen:'8/8/4k3/8/4K3/8/8/8 w - - 0 1',playerColor:'w',goal:'Demonstrasi opposition. Coba rebut kotak kunci dengan raja.',hint:'Raja berhadapan satu kotak kosong. Pemegang opposition mengontrol.'},
  {id:'rkp',name:'Rook vs Pawn',fen:'R7/8/8/4k3/8/4p3/8/K7 w - - 0 1',playerColor:'w',goal:'Tahan pion hitam (draw). Benteng harus aktif dan raja mendekat.',hint:'Benteng serang dari belakang. Jangan biarkan raja hitam mendukung pion.'}
];

/* ============ STATE ============ */
let state = {
  tab:'belajar', filter:'all', query:'', detail:null,
  quiz:{q:null,opts:[],answered:false,score:0,total:0,streak:0,best:0,correctIdx:0,chosenIdx:-1},
  pos:{list:POSITIONS,current:null,chess:null,playerColor:'w',sel:null,hints:[],aiThinking:false,status:null,statusType:'info'}
};

function loadProgress(){
  try{
    const p = JSON.parse(localStorage.getItem('eg_progress')||'{}');
    Object.assign(state.quiz,p.quiz||{});
    state.pos.solved = p.solved||{};
  }catch(e){state.pos.solved={};}
}
function saveProgress(){
  localStorage.setItem('eg_progress',JSON.stringify({quiz:state.quiz,solved:state.pos.solved}));
}
loadProgress();

const app = document.getElementById('app');

/* ============ RENDER ROUTER ============ */
function render(){
  if(state.detail!==null){return renderDetail();}
  if(state.pos.current!==null){return renderPosisiPlay();}
  switch(state.tab){
    case 'belajar': return renderBelajar();
    case 'latihan': return renderLatihan();
    case 'posisi': return renderPosisiList();
    case 'progress': return renderProgress();
  }
}

/* ============ BELAJAR ============ */
function renderBelajar(){
  let filtered = TERMS;
  if(state.filter!=='all') filtered = filtered.filter(t=>t.cat===state.filter);
  if(state.query){
    const q = state.query.toLowerCase();
    filtered = filtered.filter(t=>t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));
  }
  const catList = Object.entries(CATS).map(([k,v])=>
    `<button class="cat ${state.filter===k?'active':''}" data-cat="${k}">${v}</button>`).join('');
  const items = filtered.length ? filtered.map(t=>
    `<div class="item" data-id="${t.id}"><div><div class="item-name">${t.name}</div><div class="item-cat">${CATS[t.cat]}</div></div><span class="item-arrow">›</span></div>`).join('')
    : '<div class="empty">Tidak ada istilah ditemukan</div>';
  app.innerHTML = `
    <div class="search"><input type="search" placeholder="Cari istilah..." value="${state.query}" id="q"></div>
    <div class="cats"><button class="cat ${state.filter==='all'?'active':''}" data-cat="all">Semua</button>${catList}</div>
    <div class="list">${items}</div>`;
  document.getElementById('q').addEventListener('input',e=>{
    state.query=e.target.value; renderBelajar(); document.getElementById('q').focus();
  });
  document.querySelectorAll('.cat').forEach(el=>el.addEventListener('click',()=>{state.filter=el.dataset.cat;renderBelajar();}));
  document.querySelectorAll('.list .item').forEach(el=>el.addEventListener('click',()=>{state.detail=parseInt(el.dataset.id);render();}));
}

function renderDetail(){
  const t = TERMS[state.detail];
  if(!t){state.detail=null;return render();}
  app.innerHTML = `
    <div class="detail">
      <button class="back" onclick="goBack()">‹ Kembali</button>
      <span class="tag">${CATS[t.cat]}</span>
      <h2>${t.name}</h2>
      <p>${t.desc}</p>
      <div style="margin-top:24px;padding:14px;background:#f5f5f7;border-radius:12px;font-size:13px;color:#666;line-height:1.6">
        💡 Cari tutorial lengkap: <b>${t.name}</b> di Chessable / Lichess Study / YouTube.
      </div>
    </div>`;
}
window.goBack = ()=>{state.detail=null;render();};

/* ============ KUIS ============ */
function renderLatihan(){
  const q = state.quiz;
  if(!q.q) startQuestion();
  const optsHtml = q.opts.map((o,i)=>{
    let cls='opt';
    if(q.answered){ if(i===q.correctIdx) cls+=' correct'; else if(i===q.chosenIdx) cls+=' wrong'; }
    return `<button class="${cls}" data-opt="${i}" ${q.answered?'disabled':''}>${o.name}</button>`;
  }).join('');
  app.innerHTML = `
    <div class="quiz">
      <h2>Kuis Istilah</h2>
      <div class="score">Skor: ${q.score}/${q.total} · Streak: ${q.streak}</div>
      <div class="q-card"><div class="q-label">Istilah ini adalah?</div><div class="q-text">${q.q.desc}</div></div>
      ${optsHtml}
      <button class="next-btn" id="next" ${q.answered?'':'disabled'}>${q.answered?'Soal Berikutnya →':'Pilih jawaban dulu'}</button>
    </div>`;
  document.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{
    if(q.answered)return;
    const i=parseInt(el.dataset.opt); q.chosenIdx=i; q.answered=true;
    if(i===q.correctIdx){q.score++;q.total++;q.streak++;if(q.streak>q.best)q.best=q.streak;}
    else{q.total++;q.streak=0;}
    saveProgress(); renderLatihan();
  }));
  document.getElementById('next').addEventListener('click',()=>{q.q=null;q.answered=false;startQuestion();renderLatihan();});
}

function startQuestion(){
  const q = state.quiz;
  const t = TERMS[Math.floor(Math.random()*TERMS.length)];
  const sameCat = TERMS.filter(x=>x.cat===t.cat && x.id!==t.id);
  const pool = sameCat.length>=3?sameCat:TERMS.filter(x=>x.id!==t.id);
  const shuffled = pool.slice().sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [t,...shuffled].sort(()=>Math.random()-0.5);
  q.q=t; q.opts=opts; q.correctIdx=opts.findIndex(x=>x.id===t.id); q.chosenIdx=-1; q.answered=false;
}

/* ============ POSISI LIST ============ */
function renderPosisiList(){
  const items = POSITIONS.map(p=>{
    const done = state.pos.solved&&state.pos.solved[p.id];
    return `<div class="pos-item" data-id="${p.id}">
      <div><div class="pn">${p.name} ${done?'✅':''}</div><div class="pg">${p.playerColor==='w'?'Main Putih':'Main Hitam'}</div></div>
      <span class="ar">›</span></div>`;
  }).join('');
  app.innerHTML = `<div class="pos-list"><h2 style="padding:8px 4px 12px;font-size:18px">Latihan Posisi</h2>${items}</div>`;
  document.querySelectorAll('.pos-item').forEach(el=>el.addEventListener('click',()=>{
    startPosition(el.dataset.id);
  }));
}

function startPosition(id){
  const p = POSITIONS.find(x=>x.id===id);
  if(!p)return;
  state.pos.current = p;
  state.pos.chess = new Chess(p.fen);
  state.pos.playerColor = p.playerColor;
  state.pos.sel = null;
  state.pos.hints = [];
  state.pos.status = null;
  state.pos.statusType = 'info';
  state.pos.aiThinking = false;
  render();
}

function renderPosisiPlay(){
  const pos = state.pos;
  const chess = pos.chess;
  // flip board if player is black
  const flip = pos.playerColor==='b';
  const board = chess.board();
  let boardHtml='';
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const rr = flip?7-r:r, ff = flip?7-f:f;
      const sq = board[rr][ff];
      const sqName = 'abcdefgh'[ff]+(8-rr);
      const isLight = (rr+ff)%2===0;
      let cls = 'sq '+(isLight?'light':'dark');
      if(pos.sel===sqName) cls+=' sel';
      if(pos.hints.includes(sqName)) cls+= sq?' hint-cap':' hint-move';
      const isKingInCheck = sq && sq.type==='k' && chess.in_check() && sq.color===chess.turn();
      if(isKingInCheck) cls+=' check';
      let pieceHtml='';
      if(sq){
        const sym = PIECES[sq.type];
        const colorCls = sq.color==='w'?'piece-w':'piece-b';
        pieceHtml = `<span class="${colorCls}">${sym}</span>`;
      }
      boardHtml += `<div class="${cls}" data-sq="${sqName}">${pieceHtml}</div>`;
    }
  }

  let statusHtml = '';
  if(pos.status){
    const cls = pos.statusType==='win'?'win':pos.statusType==='lose'?'lose':pos.statusType==='draw'?'draw':'info';
    statusHtml = `<div class="status ${cls}">${pos.status}</div>`;
  }

  app.innerHTML = `
    <div class="board-wrap">
      <button class="back" onclick="closePos()" style="margin-bottom:10px;background:none;border:none;color:#1a1a2e;font-size:15px;cursor:pointer;font-weight:500">‹ Kembali</button>
      <div class="board">${boardHtml}</div>
      <div class="pos-info" style="margin-top:14px">
        <h2>${pos.current.name}</h2>
        <div class="goal">🎯 ${pos.current.goal}</div>
        <div class="hint">💡 ${pos.current.hint}</div>
        ${statusHtml}
        <div class="btn-row">
          <button class="btn-primary" onclick="resetPos()">Ulangi</button>
          <button class="btn-secondary" onclick="showSolutionHint()">Lihat Hint</button>
        </div>
      </div>
    </div>`;

  document.querySelectorAll('.sq').forEach(el=>{
    el.addEventListener('click',()=>onSquareClick(el.dataset.sq));
  });
}

window.closePos = ()=>{state.pos.current=null;state.pos.chess=null;render();};
window.resetPos = ()=>{ if(state.pos.current) startPosition(state.pos.current.id); };
window.showSolutionHint = ()=>{ alert(state.pos.current.hint); };

function onSquareClick(sqName){
  const pos = state.pos;
  const chess = pos.chess;
  if(pos.aiThinking || chess.game_over()) return;
  // if it's not player's turn
  if(chess.turn()!==pos.playerColor) return;
  const piece = chess.get(sqName);
  // if selecting own piece
  if(piece && piece.color===pos.playerColor){
    pos.sel = sqName;
    pos.hints = chess.moves({square:sqName,verbose:true}).map(m=>m.to);
    renderPosisiPlay();
    return;
  }
  // if clicking a hint square -> move
  if(pos.sel && pos.hints.includes(sqName)){
    let promo;
    if(isPromotion(pos.sel,sqName,pos.playerColor)) promo='q';
    try{
      chess.move({from:pos.sel,to:sqName,promotion:promo});
    }catch(e){return;}
    pos.sel=null; pos.hints=[];
    afterMove();
    return;
  }
  // else deselect
  pos.sel=null; pos.hints=[];
  renderPosisiPlay();
}

function isPromotion(from,to,color){
  const rank = to[1];
  if(color==='w' && rank==='8') return true;
  if(color==='b' && rank==='1') return true;
  return false;
}

function afterMove(){
  const pos = state.pos;
  const chess = pos.chess;
  // check game over
  if(chess.game_over()){
    handleGameOver();
    renderPosisiPlay();
    return;
  }
  // AI move
  if(chess.turn()!==pos.playerColor){
    pos.aiThinking = true;
    pos.status = 'AI berpikir...'; pos.statusType='info';
    renderPosisiPlay();
    setTimeout(()=>{
      const aiMove = getAIMove(chess,3);
      if(aiMove){
        try{chess.move(aiMove);}catch(e){}
      }
      pos.aiThinking=false;
      if(chess.game_over()){handleGameOver();}
      else{pos.status=null;}
      renderPosisiPlay();
    },80);
  } else {
    renderPosisiPlay();
  }
}

function handleGameOver(){
  const pos = state.pos;
  const chess = pos.chess;
  const playerLost = chess.turn()===pos.playerColor;
  if(chess.in_checkmate()){
    if(playerLost){
      pos.status = '❌ Skakmat — kamu kalah. Coba lagi!';
      pos.statusType='lose';
    } else {
      pos.status = '🎉 Skakmat — kamu menang!';
      pos.statusType='win';
      markSolved(pos.current.id);
    }
  } else if(chess.in_stalemate()||chess.in_draw()){
    pos.status = '🤝 Seri (stalemate/draw).';
    pos.statusType='draw';
    // for defense positions, draw = success
    if(pos.current.id==='philidor'||pos.current.id==='rkp'||pos.current.id==='opp'){
      pos.status = '✅ Berhasil bertahan (seri)!';
      pos.statusType='win';
      markSolved(pos.current.id);
    }
  } else {
    pos.status = 'Game over.';
    pos.statusType='info';
  }
}

function markSolved(id){
  if(!state.pos.solved) state.pos.solved={};
  state.pos.solved[id]=true;
  saveProgress();
}

/* ============ AI SEDERHANA ============ */
const PIECES = {p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};

function evalFull(chess){
  if(chess.in_checkmate()) return chess.turn()==='w'?-99999:99999;
  if(chess.in_draw()||chess.in_stalemate()) return 0;
  const val = {p:100,n:320,b:330,r:500,q:900,k:0};
  let s=0;
  chess.board().forEach(row=>row.forEach(sq=>{
    if(!sq) return;
    s += sq.color==='w' ? val[sq.type] : -val[sq.type];
  }));
  // mobility bonus
  const mob = chess.moves().length;
  s += (chess.turn()==='w'?1:-1)*mob*2;
  return s;
}

function search(chess, depth, alpha, beta){
  if(depth===0 || chess.game_over()) return evalFull(chess);
  const moves = chess.moves({verbose:true});
  if(chess.turn()==='w'){
    let best=-Infinity;
    for(const m of moves){
      chess.move(m);
      const s = search(chess,depth-1,alpha,beta);
      chess.undo();
      if(s>best)best=s;
      if(best>alpha)alpha=best;
      if(alpha>=beta)break;
    }
    return best;
  } else {
    let best=Infinity;
    for(const m of moves){
      chess.move(m);
      const s = search(chess,depth-1,alpha,beta);
      chess.undo();
      if(s<best)best=s;
      if(best<beta)beta=best;
      if(alpha>=beta)break;
    }
    return best;
  }
}

function getAIMove(chess, depth){
  const moves = chess.moves({verbose:true});
  if(!moves.length) return null;
  const isWhite = chess.turn()==='w';
  let bestScore = isWhite ? -Infinity : Infinity;
  let bestMoves = [];
  for(const m of moves){
    chess.move(m);
    const s = search(chess,depth-1,-Infinity,Infinity);
    chess.undo();
    if(isWhite ? s>bestScore : s<bestScore){
      bestScore = s;
      bestMoves = [m];
    } else if(s===bestScore){
      bestMoves.push(m);
    }
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

/* ============ PROGRESS ============ */
function renderProgress(){
  const q = state.quiz;
  const acc = q.total>0?Math.round((q.score/q.total)*100):0;
  const solved = Object.keys(state.pos.solved||{}).length;
  const total = POSITIONS.length;
  app.innerHTML = `
    <div class="progress">
      <div class="stat-card"><h3>Kuis</h3><div class="big">${q.score}/${q.total}</div><div class="sub">Akurasi ${acc}%</div></div>
      <div class="stat-card"><h3>Streak Terbaik</h3><div class="big">${q.best}</div><div class="sub">jawaban benar berturut-turut</div></div>
      <div class="stat-card"><h3>Posisi Diselesaikan</h3><div class="big">${solved}/${total}</div><div class="sub">latihan papan</div></div>
      <button class="reset-btn" onclick="resetAll()">Reset Semua Progress</button>
    </div>`;
}

window.resetAll = ()=>{
  if(!confirm('Reset semua progress?')) return;
  state.quiz = {q:null,opts:[],answered:false,score:0,total:0,streak:0,best:0,correctIdx:0,chosenIdx:-1};
  state.pos.solved = {};
  saveProgress(); render();
};

/* ============ NAV ============ */
document.querySelectorAll('.nav button').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
    state.tab = el.dataset.tab;
    state.detail = null;
    state.pos.current = null;
    render();
  });
});

render();
</script>
